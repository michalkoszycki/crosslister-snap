<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Content-Security-Policy. Everything the page runs comes from this repo
  ('self'); the only place it may talk to is the home PC's service.
    connect-src  https://*.ts.net       -> the PC through Tailscale Funnel
                                           (https://<pc>.<tailnet>.ts.net)
                 http://127.0.0.1, http://localhost (any port)
                                        -> the service on the PC itself, for trying the page there
  core.js checkSettings() accepts exactly these hosts; change both together.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self';
  img-src 'self' blob: data:;
  connect-src 'self' https://*.ts.net https://*.ts.net:* http://127.0.0.1:* http://localhost:*;
  manifest-src 'self';
  base-uri 'none';
  form-action 'none';
  object-src 'none'">
<meta name="theme-color" content="#101418">
<meta name="referrer" content="no-referrer">
<title>crosslister snap</title>
<link rel="stylesheet" href="styles.css?v=1.3.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<header>
  <h1>crosslister snap</h1>
  <button type="button" id="settings-toggle" class="link" aria-expanded="false"
          aria-controls="settings">Settings</button>
</header>

<main>
  <p id="offline" class="banner banner-warn" aria-live="polite" hidden>
    You are offline. Photos wait on this page and go to the PC when you are back.
  </p>
  <p id="message" class="message" hidden></p>

  <section id="settings" class="card" hidden>
    <label class="field">
      <span class="field-label">PC address</span>
      <input id="pc-address" type="url" inputmode="url" autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="https://pc.tail1234.ts.net">
    </label>
    <label class="field">
      <span class="field-label">Key</span>
      <input id="pc-key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="from CROSSLISTER_KEYS on the PC">
    </label>
    <button type="button" id="settings-save" class="secondary">Save and check</button>
    <p id="settings-status" class="small"></p>
  </section>

  <section id="work">
    <label class="field">
      <span class="field-label">Item name</span>
      <input id="item-name" type="text" inputmode="text" autocomplete="off"
             autocapitalize="sentences" placeholder="e.g. Blue Levi jacket">
    </label>
    <p id="cleaned" class="small mono" hidden></p>
    <p id="hint" class="small">Type the item name to start snapping.</p>

    <label id="snap-label" class="big snap" for="snap-input">Snap</label>
    <input id="snap-input" type="file" accept="image/*" capture="environment" class="hidden-input">

    <label id="gallery-label" class="secondary" for="gallery-input">Add from gallery</label>
    <input id="gallery-input" type="file" accept="image/*" multiple class="hidden-input">

    <p id="progress" class="progress"></p>
    <ul id="strip" class="strip"></ul>

    <label class="field">
      <span class="field-label">
        Notes for this item
        <span id="note-status" class="note-status"></span>
      </span>
      <textarea id="note" rows="3" autocomplete="off" autocapitalize="sentences"
                placeholder="Size, flaws, brand, anything the listing should say."></textarea>
    </label>

    <div class="venues">
      <div class="venue">
        <button type="button" id="ebay-btn" class="big venue-btn">ebay</button>
        <p id="ebay-status" class="venue-status" aria-live="polite"></p>
        <a id="ebay-link" class="venue-link" target="_blank" rel="noopener noreferrer" hidden></a>
      </div>
      <div class="venue">
        <button type="button" id="craigslist-btn" class="big venue-btn">craigslist</button>
        <p id="craigslist-status" class="venue-status" aria-live="polite"></p>
        <a id="craigslist-link" class="venue-link" target="_blank" rel="noopener noreferrer" hidden></a>
      </div>
    </div>
    <p id="venue-hint" class="small hint-line"></p>

    <p id="done-hint" class="small hint-line"></p>
    <button type="button" id="next-item" class="big done"
            aria-label="Done with this item, start the next one">DONE</button>
  </section>
</main>

<footer class="small">
  <p class="version-line">v<span id="version" class="mono"></span></p>
</footer>

<script type="module" src="app.js?v=1.3.0"></script>
</body>
</html>
